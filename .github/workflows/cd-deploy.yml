name: Admin Frontend CD
on:
  push:
    branches: [ production ]
permissions:
  contents: read
concurrency:
  group: production-admin-frontend-cd
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Docker Image
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_API_PREFIX: ${{ secrets.NEXT_PUBLIC_API_PREFIX }}
          NEXT_PUBLIC_GLOBAL_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_GLOBAL_PUBLIC_KEY }}
        run: |
          docker build --pull \
            --build-arg NEXT_PUBLIC_BACKEND_URL="$NEXT_PUBLIC_BACKEND_URL" \
            --build-arg NEXT_PUBLIC_API_PREFIX="$NEXT_PUBLIC_API_PREFIX" \
            --build-arg NEXT_PUBLIC_GLOBAL_PUBLIC_KEY="$NEXT_PUBLIC_GLOBAL_PUBLIC_KEY" \
            -t aluminate/admin-frontend:${{ github.sha }} \
            -t aluminate/admin-frontend:latest \
            .
      - name: Save Docker Image
        run: docker save aluminate/admin-frontend:latest | gzip > admin-frontend.tar.gz
      - name: Copy Image to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: admin-frontend.tar.gz
          target: /opt/aluminate/app/aluminate-admin-frontend/
          rm: false
      - name: Load & Restart on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "Loading new Docker image..."
            cd /opt/aluminate/app/aluminate-admin-frontend
            docker load < admin-frontend.tar.gz
            rm -f admin-frontend.tar.gz
            echo "Recreating admin-frontend container..."
            docker compose \
              -p aluminate-global-backend \
              -f /opt/aluminate/config/docker-compose.yml \
              --env-file /opt/aluminate/config/global.env \
              up -d --force-recreate --no-deps --remove-orphans admin-frontend
            echo "Cleaning unused images..."
            docker image prune -f
            echo "Waiting for startup..."
            sleep 15
            echo "Container status:"
            docker ps | grep admin-frontend
            echo "Recent logs:"
            docker compose \
              -p aluminate-global-backend \
              -f /opt/aluminate/config/docker-compose.yml \
              --env-file /opt/aluminate/config/global.env \
              logs --tail=50 admin-frontend
            echo "Deployment complete"
      - name: Deployment Success
        run: echo "Admin Frontend deployed to Production"
