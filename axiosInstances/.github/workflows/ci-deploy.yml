name: Admin Frontend CI

on:
  pull_request:
    branches: [ production ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-admin-frontend-ci
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_API_PREFIX: ${{ secrets.NEXT_PUBLIC_API_PREFIX }}
          NEXT_PUBLIC_GLOBAL_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_GLOBAL_PUBLIC_KEY }}
        run: |
          docker build --pull \
            --build-arg NEXT_PUBLIC_BACKEND_URL="$NEXT_PUBLIC_BACKEND_URL" \
            --build-arg NEXT_PUBLIC_API_PREFIX="$NEXT_PUBLIC_API_PREFIX" \
            --build-arg NEXT_PUBLIC_GLOBAL_PUBLIC_KEY="$NEXT_PUBLIC_GLOBAL_PUBLIC_KEY" \
            -t aluminate/admin-frontend:${{ github.sha }} \
            -t aluminate/admin-frontend:latest \
            .

      - name: Comment PR on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Admin frontend build succeeded. Ready to merge to production.'
            })